<style>
html,body{margin:0;height:100%;background:#F7F9F8}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top)}
#fb{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;font:15px system-ui,sans-serif;color:#1F2422;gap:14px;text-align:center;padding:24px}
#fb a{color:#fff;background:#1E6643;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<iframe id="app" title="Halan AZ" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<div id="fb"><div>The app did not load here.</div><a id="fbl" href="#">Open Halan AZ</a></div>
<script>
var APP_URL = "PASTE_YOUR_APP_LINK_HERE";
var f = document.getElementById('app'), loaded = false;
f.onload = function () { loaded = true; };
f.src = APP_URL;
document.getElementById('fbl').href = APP_URL;
setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'flex'; }, 12000);
</script>
</body>
